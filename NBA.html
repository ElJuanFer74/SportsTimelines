<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="CONTENT-TYPE" content="text/html; charset=utf-8">
    <title>National Basketball Association - Timeline</title>
    <link rel="stylesheet" href="sports_tl.css">
    <link rel="stylesheet" type="text/css" href="./nba_grid.css">
</head>

<body>
    <header class="page-header">
        <h1 class="title-header">Timeline equipos NBA</h1>
    </header>

    <main class="timeline-wrapper" id="wrapper-sports">
        <h2 class="league-title league-title-pos">1949 - Present</h2>
        <div class="timeline" id="timeline-sports">
            <div class="cont-tabla fix-tablehead">
                <table class="table_timeline" id="table_timeline">
                    <thead>
                    </thead>
                    <tbody>
                    </tbody>
                    <tfoot>
                    </tfoot>
                </table>
            </div>

        </div>
    </main>
    <script type="module">
        import { initNbaTableYears, initNbaTableData } from './nba.js';
        initNbaTableYears();
        const stageRows = initNbaTableData();
        const tbody = document.querySelector('#table_timeline tbody');
        stageRows.forEach((r) => tbody.appendChild(r));
    </script>
</body>

</html>
